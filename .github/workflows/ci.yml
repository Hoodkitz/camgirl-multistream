name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: pytest -q
  postgres-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: multistream
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      ENV: test
      PG_TEST_OWNER_URL: postgresql+asyncpg://owner:owner@localhost:5432/multistream
      PG_TEST_APP_URL: postgresql+asyncpg://application_role:app@localhost:5432/multistream
      PG_APP_URL: postgresql://application_role:app@localhost:5432/multistream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Migrate as owner
        run: DATABASE_URL=$PG_TEST_OWNER_URL alembic upgrade head && DATABASE_URL=$PG_TEST_OWNER_URL alembic check
      - run: PGPASSWORD=owner psql -h localhost -U owner -d multistream -c "ALTER ROLE application_role LOGIN PASSWORD 'app'"
      - name: Full API suite as RLS-restricted app role
        run: pytest -q tests/api tests/integration
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t app:ci .
