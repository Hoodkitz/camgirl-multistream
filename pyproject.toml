[project]
name = "camgirl-multistream"
version = "0.1.0"
description = "Multi-Stream + Chat-Bündelung für Camgirls"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic[dotenv]",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "httpx",
    "redis",
    "python-multipart",
    "python-dotenv",
    "alembic",
    "websockets",
    "aiohttp",
    "pydub",
    "nltk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
